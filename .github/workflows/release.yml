name: Build and Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller setuptools

      - name: Install Package in Editable Mode
        run: |
          pip install -e .

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "WinDiskArchitect" --add-data "src/windisk;windisk" src/windisk/cli.py --console --onefile

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinDiskArchitect-Windows-x64
          path: dist/WinDiskArchitect.exe

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WinDiskArchitect.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
